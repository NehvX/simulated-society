[project]
name = "civitas"
version = "1.1.0"
description = "An agent-based simulation of a human society built from research-grounded equations of individual behaviour."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
